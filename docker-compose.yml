services:
  pmv:
    build: .
    container_name: pmv_conservacion_marina
    ports:
      - "8501:8501"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_NAME: conservacion_marina
      DB_PASSWORD: ${DB_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
